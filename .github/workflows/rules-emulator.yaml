# DIAGNOSTIC ONLY — runs the Security Rules against the OFFICIAL Firestore
# emulator. Touches no production resource (demo- project, local emulator).
# Triggered by pushing to the `diag/emulator` branch, or manually.
name: Rules emulator (diagnóstico)

on:
  push:
    branches: [diag/emulator]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile

      - name: Incidente (emulador oficial)
        run: |
          set -o pipefail
          pnpm exec firebase emulators:exec --only firestore --project demo-royal-sales-ia \
            "node --test tests/emulator/incident-super-admin.emulator.test.mjs" 2>&1 | tee incident-output.txt

      - name: Compilar .test-build
        if: always()
        run: pnpm exec tsc -p tsconfig.test.json
      
      - name: Suite completa del emulador (comando pedido)
        if: always()
        run: |
          set -o pipefail
          pnpm exec firebase emulators:exec --only firestore --project demo-royal-sales-ia \
            "node --test tests/emulator/*.test.mjs" 2>&1 | tee full-output.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logs
          path: |
            incident-output.txt
            full-output.txt
            firestore-debug.log
          if-no-files-found: warn
